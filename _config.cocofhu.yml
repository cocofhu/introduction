work:
  title: 正在进行
  items:
    - date: "2026 · PRODUCT"
      title: "SkillHub 研发负责人"
      url: "https://skillhub.cn/"
      link: "打开 skillhub.cn"
      excerpt: "面向中国用户的 AI Skills 社区——帮 Agent 搜索、安装、调用Skill。"
      hovers:
        - match: "Skills 社区"
          tip: 可以来试试，DSH插件我们也支持了，目前在持续优化
        - match: 中国
          tip: 我们做了对中国用户的优化：包括翻译、镜像加速、安全扫描等，我们也在尝试新的功能：AgentPay，Skill比赛等
        - match: 调用
          tip: 我们最近在支持云技能
    - date: "2026 · AI HARNESS"
      title: "AI Harness 提效"
      url: "https://github.com/cocofhu/approving"
      link: "打开 Approving"
      excerpt: "我在并行做很多项目和尝试一些新的东西，最大的问题在于：准确表达需求，以及理解 Agent 输出。\n\n目前主要在探索如何在 10 秒内读懂 AI 生成的内容——Demo、流程图等图形化表达；最近也在想用 AI 会议来对齐需求。\n\n开源实践见 Approving。"
      hovers:
        - match: 表达需求
          tip: 对对对就是这样，太对了
        - match: "理解 Agent 输出"
          tip: 这么多字我也看不懂啊，给我用，最直白，最直接，最不绕弯子......
        - match: Demo
          tip: 前端到底改了什么，交互是什么样的
        - match: 流程图
          tip: 快速理解后端流程
        - match: Approving
          tip: "还没来得及整理，因为最开始这个工作流完成之后什么也不管，每天就同意审批，所以就取名叫了approving, 嘿嘿，还是要认真确认啊"
        - match: 很多项目
          tip: "我是一个NAS玩家，我有全套的AIO服务器， 有自己的基建：CI/CD、Repo、工具链等，如果有兴趣可以和我交流"
        - match: "10 秒内"
          tip: 多个项目并行切换的时候我要快速理解和决策，这是最大的瓶颈，AI暂时不能取代我的创作力
        - match: "AI 会议"
          tip: "Agent直接拉我开会， 目前已经有一些进展了，敬请期待"
    - date: "2026 · CREATION"
      title: 表达输出
      url: "https://github.com/cocofhu"
      link: "去 GitHub 看看"
      excerpt: "想去学习一些运营方法，让自己的产品被更多人用起来。\n\n目前计划把我做的小工具在 GitHub 上推广一下，也在社交媒体上做一些输出。"
      hovers:
        - match: 运营方法
          tip: 像通过自己的办法获得一些用户
        - match: 产品
          tip: 例如这个主页，是不是很酷
        - match: GitHub
          tip: 还没有整理，最近会抽时间整理下
        - match: 小工具
          tip: 从2024年到现在，我已经有104个小项目了，想知道我做了些什么吗
        - match: 学习
          tip: 我最近在学计算机图形学
        - match: 计划
          tip: 大部分情况下我没有计划
        - match: 社交媒体
          tip: CSDN、X、知乎、B站
